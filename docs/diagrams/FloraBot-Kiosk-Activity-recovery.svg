al" font-size="13" text-anchor="middle" fill="#183e2b">lỗi tủ</text><circle cx="190" cy="1844" r="14" fill="white" stroke="#183e2b" stroke-width="2"/><circle cx="190" cy="1844" r="8" fill="#183e2b"/><rect x="366" y="1970" width="248" height="90" rx="0" fill="#fffdf2" stroke="#52735a"/><text x="490" y="1996" font-family="Arial" font-size="12" text-anchor="middle" fill="#183e2b">Timeout / lỗi không rõ: xóa dữ</text><text x="490" y="2012" font-family="Arial" font-size="12" text-anchor="middle" fill="#183e2b">liệu nhập, không tự gửi lại. Kiểm</text><text x="490" y="2028" font-family="Arial" font-size="12" text-anchor="middle" fill="#183e2b">tra cửa và liên hệ hỗ trợ trước</text><text x="490" y="2044" font-family="Arial" font-size="12" text-anchor="middle" fill="#183e2b">khi tạo yêu cầu khác.</text></svg>