nt-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">và mã biên nhận 8 ký tự chữ/số</text><path d="M490,450 L578,494 L490,538 L402,494 Z" fill="#fff8e6" stroke="#a38135"/><text x="490" y="499" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">Định dạng hợp lệ?</text><rect x="366" y="580" width="248" height="66" rx="12" fill="#f7fbf5" stroke="#52735a"/><text x="490" y="610" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">Hiển thị lỗi và đưa focus</text><text x="490" y="626" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">về trường cần sửa</text><rect x="66" y="690" width="248" height="66" rx="12" fill="#f7fbf5" stroke="#52735a"/><text x="190" y="720" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">Kiểm tra đúng tủ, cửa đã đóng</text><text x="190" y="736" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">Xác nhận gửi yêu cầu</text><rect x="366" y="810" width="248" height="66" rx="12" fill="#f7fbf5" stroke="#52735a"/><text x="490" y="832" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">Gửi yêu cầu nhận tiếp</text><text x="490" y="848" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">Không yêu cầu đăng nhập thành</text><text x="490" y="864" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">viên</text><rect x="666" y="930" width="248" height="66" rx="12" fill="#f7fbf5" stroke="#52735a"/><text x="790" y="952" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">Kiểm tra biên nhận, kiosk, điều</text><text x="790" y="968" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">kiện đơn và lệnh / cửa đang hoạt</text><text x="790" y="984" font-family="Arial" font-size="13" text-anchor="middle" fill="#183e2b">động</text><path d="M790,1040 L878,1084 L790,1128 L702,1084 Z" fill="#fff8e6" stroke="#a38135"/><text x="790" y="1089" font-family="Arial" font-size