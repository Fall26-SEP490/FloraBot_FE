name: Cross-repository browser integration
on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Exact FloraBot_BE commit SHA containing the matching API and migrations
        required: true
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a pinned backend revision
        env:
          BACKEND_REF: ${{ inputs.backend_ref }}
        run: '[[ "$BACKEND_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          path: FE
      - uses: actions/checkout@v4
        with:
          repository: Fall26-SEP490/FloraBot_BE
          ref: ${{ inputs.backend_ref }}
          token: ${{ secrets.COMPANION_REPO_TOKEN || github.token }}
          path: BE
      - uses: actions/checkout@v4
        with:
          repository: Fall26-SEP490/FloraBot_Kios
          token: ${{ secrets.COMPANION_REPO_TOKEN || github.token }}
          path: Kios
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.10.0
      - run: pnpm install --frozen-lockfile
        working-directory: FE
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: FE
      - run: docker compose up -d --wait postgres valkey rabbitmq
        working-directory: BE
      - run: pnpm test:integration
        working-directory: FE
      - name: Build and start the integrated application
        shell: pwsh
        run: ./scripts/start-local-stack.ps1
        working-directory: BE
      - name: Wait for the public API through Caddy and YARP
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8088/api/packages > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: pnpm test:stack
        working-directory: FE
      - name: Verify actual MQTT ingress into the API database
        shell: pwsh
        run: ./scripts/test-mqtt-backend.ps1
        working-directory: BE
      - name: Verify signed API-to-simulator door cycle
        shell: pwsh
        run: ./scripts/test-mqtt-door-cycle.ps1
        working-directory: BE
      - name: Stop test services
        if: always()
        run: |
          if [ -f infra/secrets/local-stack.env ]; then
            docker compose --env-file infra/secrets/local-stack.env -f docker-compose.yml -f docker-compose.app.yml down
          else
            docker compose down
          fi
        working-directory: BE
