name: Frontend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y
      - run: pnpm test:portal
      - run: pnpm exec playwright test --config playwright.kiosk.config.ts
      - name: Start landing preview for accessibility and performance gates
        run: |
          pnpm --filter @florabot/landing preview --port 4321 > /tmp/florabot-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/florabot-preview.log
          exit 1
      - run: pnpm exec pa11y-ci --config .pa11yci.cjs
      - name: Verify native browser zoom at 200 percent
        run: pnpm audit:browser-zoom
      - name: Measure initial and interactive JavaScript (informational)
        run: pnpm audit:landing-js
      - run: pnpm exec lhci autorun --config=lighthouserc.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            artifacts/lighthouse/
            artifacts/landing-js-budget.json
            artifacts/browser-zoom.json
            .impeccable/review/
